<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aiman Azhan — Coming soon</title>
<meta name="description" content="Aiman Azhan — new site coming soon.">
<meta property="og:title" content="Aiman Azhan">
<meta property="og:description" content="New site coming soon.">
<meta property="og:url" content="https://aimanazhan.my">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f3ee;--ink:#1c1b19;--muted:#6b675f;--line:#ddd6ca;--accent:#2f5d50}
  @media (prefers-color-scheme:dark){:root{--bg:#141413;--ink:#ece8e1;--muted:#9b968c;--line:#2c2b28;--accent:#7fb3a2}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:400 17px/1.6 Inter,system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:64px 28px}
  .card{max-width:560px;width:100%}
  .mark{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:600 22px Fraunces,serif;margin-bottom:32px}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--accent);font:500 13px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
  .dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
  @media (prefers-reduced-motion:reduce){.dot::after{animation:none}}
  h1{font:600 clamp(40px,8vw,64px)/1.05 Fraunces,serif;letter-spacing:-.02em;margin-bottom:16px}
  .lede{color:var(--muted);font-size:19px;margin-bottom:40px;max-width:32ch}
  ul{list-style:none;border-top:1px solid var(--line)}
  li{border-bottom:1px solid var(--line)}
  li a{display:flex;justify-content:space-between;align-items:center;padding:18px 0;color:var(--ink);text-decoration:none;transition:color .15s}
  li a:hover{color:var(--accent)}
  li a span:last-child{color:var(--muted);font-size:14px}
  footer{padding:24px 28px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="mark" aria-hidden="true">A</div>
    <p class="eyebrow"><span class="dot" aria-hidden="true"></span>Coming soon</p>
    <h1>Aiman Azhan</h1>
    <p class="lede">A new site is on the way. Check back soon.</p>
    <ul>
      <li><a href="mailto:hello@aimanazhan.my">
        <span>Get in touch</span>
        <span>hello@aimanazhan.my</span>
      </a></li>
    </ul>
  </div>
</main>
<footer>© <span id="y"></span> Aiman Azhan</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
